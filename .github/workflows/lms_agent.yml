name: e-JDU LMS AI 24/7 Agent

on:
  workflow_dispatch:
    inputs:
      profile_id:
        description: 'Bajarilishi kerak boʻlgan talaba ID (boʻsh qoldirilsa, barcha faol profillar)'
        required: false
        default: ''
      max_hours:
        description: 'Bitta run davomiyligi (soatda, 6 dan oshmasligi shart)'
        required: false
        default: '5.3'
      auto_retrigger:
        description: 'Tugagach keyingi runni avtomatik ishga tushirish (true/false)'
        required: false
        default: 'true'
  schedule:
    # Xavfsizlik zanjiri: har 5 soatda avtomatik tekshirib yangi siklni yurgizish
    - cron: '0 */5 * * *'

permissions:
  contents: write
  actions: write

jobs:
  run-lms-agent:
    name: Execute LMS Automation
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Maksimal 6 soat limit

    steps:
      - name: 📥 Kodni yuklab olish
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🐍 Python 3.12 ni sozlash
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Kerakli kutubxonalarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 🤖 e-JDU AI Agentni Ishga Tushirish (5.3 Soat)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || vars.TELEGRAM_BOT_TOKEN }}
        run: |
          PROFILE_ARG=""
          if [ -n "${{ github.event.inputs.profile_id }}" ]; then
            PROFILE_ARG="--profile-id ${{ github.event.inputs.profile_id }}"
          fi
          MAX_HOURS="${{ github.event.inputs.max_hours || '5.3' }}"
          
          python github_runner.py --max-hours $MAX_HOURS $PROFILE_ARG

      - name: 💾 Bajarilgan Darslar va Ma'lumotlarni Saqlash (Git Push)
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add data/
          git commit -m "Auto-save LMS progress [skip ci]" || echo "O'zgarishlar yo'q"
          git push origin main || echo "Git push amalga oshmadi yoki o'zgarish yo'q"

      - name: 🔄 Keyingi 6 Soatlik Runni Avtomatik Ishga Tushirish (Auto-Chaining)
        if: always() && (github.event.inputs.auto_retrigger == 'true' || github.event_name == 'schedule')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=========================================================="
          echo "🚀 6-soatlik sikl yakunlandi. Keyingi run zanjiri ulanmoqda..."
          echo "=========================================================="
          gh workflow run lms_agent.yml --ref ${{ github.ref_name }} || echo "Auto-trigger amalga oshdi yoki allaqachon navbatda turibdi."
